name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Match the tag to Cargo.toml
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version v{version}")
          prerelease = "-" in version.split("+", 1)[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"prerelease={str(prerelease).lower()}", file=output)
          PY
  build:
    name: Build (${{ matrix.target }})
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked --target "$RELEASE_TARGET" -- -D warnings
      - run: cargo test --locked --target "$RELEASE_TARGET"
      - run: cargo build --locked --release --target "$RELEASE_TARGET"
      - name: Check the release executable
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          binary="target/$RELEASE_TARGET/release/codex-wechat"
          test "$("$binary" --version)" = "codex-wechat $RELEASE_VERSION"
          "$binary" --help
          "$binary" --state-dir "$RUNNER_TEMP/codex-wechat-state" status
          if "$binary" status; then
            echo 'Missing --state-dir unexpectedly succeeded' >&2
            exit 1
          fi
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package="codex-wechat-${RELEASE_TAG}-${RELEASE_TARGET}"
          mkdir -p "dist/$package"
          cp "target/$RELEASE_TARGET/release/codex-wechat" README.md README.zh-CN.md LICENSE "dist/$package/"
          cp -r deploy docs "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          assets=(
            "codex-wechat-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "codex-wechat-${RELEASE_TAG}-aarch64-unknown-linux-gnu.tar.gz"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
            tar -tzf "$asset"
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --generate-notes --title "$RELEASE_TAG" --draft \
            --prerelease="$PRERELEASE"
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
